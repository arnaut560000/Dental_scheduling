{% extends 'base.html' %}

{% block title %}Change Password · SmileCare{% endblock %}

{% block content %}
  <form class="card login" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <p class="eyebrow">SECURITY</p>
    <h1>Change password</h1>
    <label>
      Current password
      <input type="password" name="current_password" required autocomplete="current-password">
    </label>
    <label>
      New password
      <input type="password" name="new_password" minlength="12" required autocomplete="new-password">
    </label>
    <label>
      Confirm new password
      <input type="password" name="confirm_password" minlength="12" required autocomplete="new-password">
    </label>
    <button type="submit">Save new password</button>
  </form>
{% endblock %}
